name: Company
code: CMP
prefix: CMP
version: 3
description: >-
  Starter placeholder: replace these categories during onboarding before
  extracting company practices. This book is for how THIS company does the
  work — repeatable processes and expertise, with every client, project, and
  person stripped out. The Advisory, Decision Making, and Business books hold
  general craft; do not file this company's operating procedures there.
  Situation-specific facts belong in memory, not in this book.
categories:
  - name: Winning work
    description: >-
      How this company finds, qualifies, and converts demand — conversations,
      proposals, pricing conversations, and closing. The practice, not a
      named prospect or a live deal. Distinct from Client care (after they
      are a customer) and from Money (how cash is handled once the work
      exists). A specific customer's commercial terms belong in memory
      under Customers.
    index: 100
    skills: []
  - name: Client care
    description: >-
      How this company looks after a customer relationship — onboarding,
      communication, retention, and handling tension. The practice, not one
      client's people or history. Distinct from Winning work (before they
      buy) and from Delivery (doing the work). Who a customer is belongs
      in memory under Customers. The people belong under People.
    index: 200
    skills: []
  - name: Planning and scoping
    description: >-
      How this company turns a yes into a defined piece of work — scoping,
      estimating, milestones, and what "done" means. The method, not this
      project's brief or this week's plan. Distinct from Delivery (executing
      the work) and from Choosing direction (what the business will and will
      not take on). A project's brief belongs in memory under Areas.
    index: 300
    skills: []
  - name: Delivery
    description: >-
      How this company does the core work — the repeatable method, standards
      of execution, handoffs, and what good looks like. Not a project's
      status (that is memory, Areas), not a customer's configuration, and
      not implementation details that only apply once.
      Distinct from Quality and standards (the bar and the
      checks) and from Planning and scoping (defining the work before it
      starts).
    index: 400
    skills: []
  - name: Quality and standards
    description: >-
      The bar this company holds and how it checks work — review, rework,
      professional or regulatory standards, and what must never ship. The
      standard, not one job's defect list. Distinct from Delivery (doing the
      work) and from Running the business (how the shop is operated).
    index: 500
    skills: []
  - name: Running the business
    description: >-
      How the operation runs day to day — capacity, rhythm, internal
      process, and coordination. The process, not a system the business
      runs (that is memory, Areas) and not who holds which role (that is
      memory, People). Distinct from People practices (hiring and management)
      and from Money (cash).
    index: 600
    skills: []
  - name: People practices
    description: >-
      How this company hires, manages, develops, and holds people
      accountable. The practice, not the roster and not a person's role —
      those belong in memory under People. Distinct from Running the business
      (the work system) and from Client care (people outside the company).
    index: 700
    skills: []
  - name: Money
    description: >-
      How money moves in this company — pricing method, invoicing, margins,
      and commercial hygiene. The practice, not a customer's agreed fee
      (Customers) and not a project's commercial terms (Areas). Distinct from
      Winning work (the sales conversation) and from Delivery (the work that
      earns the invoice).
    index: 800
    skills: []
  - name: Choosing direction
    description: >-
      How this company chooses what to pursue, stop, or refuse — the
      repeatable judgment, not the current strategy. Purpose, mission, and
      long-term position belong in memory under Strategy. A live campaign
      or project belongs under Areas. Distinct from
      Planning and scoping (a single piece of work) and from Winning work
      (a single sale).
    index: 900
    skills: []
