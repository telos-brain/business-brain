name: Client
version: 1
description: >-
  Memory for one client. Who they are, the commercial relationship, and what
  is actually in play. Not how this company does the work — that is a skill.
  Not company-wide facts — those belong on the Company blueprint.
scope:
  type: entity
  code: clients
categories:
  - name: People
    description: >-
      One entry per person at this client who matters to the work. Title is
      the person's name. Record their role, what they care about in the work,
      and how they are involved. Update that entry when this changes. Do not
      record personal life, small talk, or chatter. Do not record our own
      team — that is the Company Team category. Distinct from Commercial
      (the deal) and from Situation (what is in play).
  - name: Commercial
    description: >-
      The commercial relationship with this client: what we sell them, terms
      already agreed, pricing already agreed, and the status of the
      relationship. Update in place when terms change. Do not record how
      invoicing or sales is done — that is a skill. Do not record other
      clients. Distinct from People (who they are) and from Situation (live
      work).
  - name: Situation
    description: >-
      What is in play with this client that will still matter after this
      week: open commitments, constraints, and decisions already made. Prefer
      few entries, updated in place. Do not record this week's task list, a
      meeting transcript, or small talk. Do not record a repeatable way of
      working — that is a skill. Distinct from Commercial (the deal) and from
      People (who they are).
