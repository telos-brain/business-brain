name: Job
version: 3
description: >-
  Shared memory of the work this business does: projects, engagements, and
  jobs. What each one is, the decisions made for it, and the durable state.
  Not the company's process for doing this kind of work — that is a skill.
  Not the standing file for a company or person — that belongs on the CRM
  blueprint.
scope: brain
categories:
  - name: Brief
    description: >-
      One entry per piece of work. Title is the job. Record the outcome,
      the constraints that define it, and who it is for. Update that entry
      in place. Do not record the general method for scoping work — that
      is a skill. Do not paste a transcript. Distinct from Decisions
      (choices already made) and from State (where it stands now).
  - name: Decisions
    description: >-
      One entry per decision made for a piece of work that should not be
      relitigated. Title names the job and the decision. Record what was
      chosen, what was rejected, and why. Do not record options that were
      only discussed, or a general decision-making method — that is a
      skill. Distinct from Brief (what the work is) and from State
      (current status).
  - name: State
    description: >-
      One entry per piece of work, updated in place. Title is the job.
      Record the owner, status, and what is blocking it. Do not log every
      meeting, weekly task list, or small talk. Do not record the process
      for running this kind of work — that is a skill. Distinct from Brief
      (the definition) and from Decisions (choices already made).
