name: Company
version: 4
description: >-
  Company-wide memory. Facts about this business that stay useful across
  relationships and projects: who works here, the direction, the systems in
  use, and what is sold. Not processes — those belong in the Company skill
  book. Not a company or person we deal with — that belongs on the CRM blueprint.
scope: brain
categories:
  - name: Team
    description: >-
      One entry per person who works in this business. Title is the person's
      name. Record their role, what they are responsible for, and what they
      currently own. Update that same entry when the role or responsibilities
      change. Do not record personal life, small talk, leave, sick days, or
      one-off chatter. Do not record how to do the job — that is a skill.
      Distinct from CRM (companies and people outside the business) and from
      Strategy (direction, not the roster).
  - name: Strategy
    description: >-
      Durable direction for the whole business: why it exists, how it wins,
      current priorities, and decisions that set direction. Keep few entries
      and update them when direction changes. Do not record planning meetings,
      weekly plans, or the method for making strategy — the method is a skill.
      Distinct from Products and services (what is sold) and from Team (who
      does the work).
  - name: Systems
    description: >-
      One entry per system, SaaS product, or tool the business actually uses.
      Title is the product name. Record what it is used for and who relies on
      it. Do not record step-by-step operation — that is a skill. Do not
      record tools that were only mentioned in passing. Distinct from Products
      and services (what this business sells, not what it subscribes to).
  - name: Products and services
    description: >-
      One entry per product or service this business sells. Title is the
      offering. Record what it is, who it is for, and how it is positioned.
      Do not record the delivery process or a particular relationship's
      purchase — process is a skill, a deal belongs on the CRM blueprint.
      Distinct from Systems (tools we use) and from Strategy (direction).
