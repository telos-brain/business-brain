name: xero_get_purchase_order_attachment_by_file_name
version: 1
description: >-
  Retrieves a specific attachment for a specific purchase order by filename. Xero API GET /api.xro/2.0/PurchaseOrders/{PurchaseOrderID}/Attachments/{FileName}.
api:
  method: GET
  path: /api.xro/2.0/PurchaseOrders/{PurchaseOrderID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: PurchaseOrderID
    description: >-
      Unique identifier for an Purchase Order.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
