name: xero_get_purchase_order_attachment_by_id
version: 1
description: >-
  Retrieves specific attachment for a specific purchase order using a unique attachment Id. Xero API GET /api.xro/2.0/PurchaseOrders/{PurchaseOrderID}/Attachments/{AttachmentID}.
api:
  method: GET
  path: /api.xro/2.0/PurchaseOrders/{PurchaseOrderID}/Attachments/{AttachmentID}
  connector: xero
parameters:
  - name: PurchaseOrderID
    description: >-
      Unique identifier for an Purchase Order.
    type: string
    required: true
  - name: AttachmentID
    description: >-
      Unique identifier for Attachment object.
    type: string
    required: true
