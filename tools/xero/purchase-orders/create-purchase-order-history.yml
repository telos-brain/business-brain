name: xero_create_purchase_order_history
version: 1
description: >-
  Creates a history record for a specific purchase orders. Xero API PUT /api.xro/2.0/PurchaseOrders/{PurchaseOrderID}/History.
api:
  method: PUT
  path: /api.xro/2.0/PurchaseOrders/{PurchaseOrderID}/History
  connector: xero
parameters:
  - name: PurchaseOrderID
    description: >-
      Unique identifier for an Purchase Order.
    type: string
    required: true
  - name: HistoryRecords
    description: >-
      Pass as a JSON array. Each item may include: Details (string): details; Changes (string): Name of branding theme; User (string): has a value of 0; DateUTC (string): UTC timestamp of creation date of branding theme.
    type: json