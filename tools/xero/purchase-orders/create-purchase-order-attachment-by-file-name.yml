name: xero_create_purchase_order_attachment_by_file_name
version: 1
description: >-
  Creates attachment for a specific purchase order. Xero API PUT /api.xro/2.0/PurchaseOrders/{PurchaseOrderID}/Attachments/{FileName}.
api:
  method: PUT
  path: /api.xro/2.0/PurchaseOrders/{PurchaseOrderID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: PurchaseOrderID
    description: >-
      Unique identifier for an Purchase Order.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
  - name: file
    description: >-
      Raw file bytes. The Xero API expects application/octet-stream. Include the file name in the path.
    type: string
    required: true
