name: xero_get_prepayments
version: 1
description: >-
  Retrieves prepayments. Xero API GET /api.xro/2.0/Prepayments.
api:
  method: GET
  path: /api.xro/2.0/Prepayments
  connector: xero
parameters:
  - name: where
    description: >-
      Xero where filter, e.g. Status=="AUTHORISED" AND Type=="ACCREC". See https://developer.xero.com/documentation/guides/how-to-guides/filtering
    type: string
  - name: order
    description: >-
      Sort expression, e.g. Date DESC or InvoiceNumber.
    type: string
  - name: page
    description: >-
      e.g. page=1 – Up to 100 prepayments will be returned in a single API call with line items shown for each prepayment.
    type: int
  - name: unitdp
    description: >-
      e.g. unitdp=4 – (Unit Decimal Places) You can opt in to use four decimal places for unit amounts.
    type: int
  - name: pageSize
    description: >-
      Number of records to retrieve per page.
    type: int
  - name: InvoiceNumbers
    description: >-
      Filter by a comma-separated list of InvoiceNumbers.
    type: string
  - name: References
    description: >-
      Filter by a comma-separated list of References.
    type: string
