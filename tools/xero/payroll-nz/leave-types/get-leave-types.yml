name: xero_nz_get_leave_types
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Retrieves leave types. Xero API GET /payroll.xro/2.0/LeaveTypes.
api:
  method: GET
  path: /payroll.xro/2.0/LeaveTypes
  connector: xero
parameters:
  - name: page
    description: >-
      Page number which specifies the set of records to retrieve. By default the number of the records per set is 100.
    type: int
  - name: ActiveOnly
    description: >-
      Filters leave types by active status. By default the API returns all leave types. Use true or false.
    type: string
