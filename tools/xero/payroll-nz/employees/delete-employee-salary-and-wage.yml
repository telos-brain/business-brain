name: xero_nz_delete_employee_salary_and_wage
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Deletes an employee's salary and wages record. Xero API DELETE /payroll.xro/2.0/Employees/{EmployeeID}/SalaryAndWages/{SalaryAndWagesID}.
api:
  method: DELETE
  path: /payroll.xro/2.0/Employees/{EmployeeID}/SalaryAndWages/{SalaryAndWagesID}
  connector: xero
parameters:
  - name: EmployeeID
    description: >-
      Employee id for single object.
    type: string
    required: true
  - name: SalaryAndWagesID
    description: >-
      Id for single salary and wages object.
    type: string
    required: true
