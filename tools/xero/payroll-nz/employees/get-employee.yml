name: xero_nz_get_employee
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Retrieves an employees using a unique employee ID. Xero API GET /payroll.xro/2.0/Employees/{EmployeeID}.
api:
  method: GET
  path: /payroll.xro/2.0/Employees/{EmployeeID}
  connector: xero
parameters:
  - name: EmployeeID
    description: >-
      Employee id for single object.
    type: string
    required: true
