name: xero_nz_create_employee_payment_method
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Creates a payment method for an employee. Xero API POST /payroll.xro/2.0/Employees/{EmployeeID}/PaymentMethods.
api:
  method: POST
  path: /payroll.xro/2.0/Employees/{EmployeeID}/PaymentMethods
  connector: xero
parameters:
  - name: EmployeeID
    description: >-
      Employee id for single object.
    type: string
    required: true
  - name: paymentMethod
    description: >-
      The payment method code. One of: Cheque, Electronically, Manual.
    type: string
  - name: bankAccounts
    description: >-
      Pass as a JSON array. Each item may include: accountName (string): Bank account name (max length = 32); accountNumber (string): Bank account number (digits only; max length = 8); sortCode (string): Bank account sort code (6 digits); particulars (string): Particulars that appear on the statement; code (string): Code of a transaction that appear on the statement; dollarAmount (number): Dollar amount of a transaction; reference (string): Statement Text/reference for a transaction that appear on the statement; calculationType (string) [FixedAmount, Balance].
    type: json
