name: xero_nz_get_employee_salary_and_wages
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Retrieves an employee's salary and wages. Xero API GET /payroll.xro/2.0/Employees/{EmployeeID}/SalaryAndWages.
api:
  method: GET
  path: /payroll.xro/2.0/Employees/{EmployeeID}/SalaryAndWages
  connector: xero
parameters:
  - name: EmployeeID
    description: >-
      Employee id for single object.
    type: string
    required: true
  - name: page
    description: >-
      Page number which specifies the set of records to retrieve. By default the number of the records per set is 100.
    type: int
