name: xero_nz_get_employee_salary_and_wage
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Retrieves an employee's salary and wages record by using a unique salary and wage ID. Xero API GET /payroll.xro/2.0/Employees/{EmployeeID}/SalaryAndWages/{SalaryAndWagesID}.
api:
  method: GET
  path: /payroll.xro/2.0/Employees/{EmployeeID}/SalaryAndWages/{SalaryAndWagesID}
  connector: xero
parameters:
  - name: EmployeeID
    description: >-
      Employee id for single object.
    type: string
    required: true
  - name: SalaryAndWagesID
    description: >-
      Id for single pay template earnings object.
    type: string
    required: true
