name: xero_nz_get_employee_tax
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Retrieves tax records for a specific employee. Xero API GET /payroll.xro/2.0/Employees/{EmployeeID}/Tax.
api:
  method: GET
  path: /payroll.xro/2.0/Employees/{EmployeeID}/Tax
  connector: xero
parameters:
  - name: EmployeeID
    description: >-
      Employee id for single object.
    type: string
    required: true
