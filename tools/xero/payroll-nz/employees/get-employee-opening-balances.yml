name: xero_nz_get_employee_opening_balances
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Retrieves the opening balance for a specific employee. Xero API GET /payroll.xro/2.0/Employees/{EmployeeID}/OpeningBalances.
api:
  method: GET
  path: /payroll.xro/2.0/Employees/{EmployeeID}/OpeningBalances
  connector: xero
parameters:
  - name: EmployeeID
    description: >-
      Employee id for single object.
    type: string
    required: true
