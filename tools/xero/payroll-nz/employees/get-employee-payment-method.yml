name: xero_nz_get_employee_payment_method
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Retrieves available payment methods for a specific employee. Xero API GET /payroll.xro/2.0/Employees/{EmployeeID}/PaymentMethods.
api:
  method: GET
  path: /payroll.xro/2.0/Employees/{EmployeeID}/PaymentMethods
  connector: xero
parameters:
  - name: EmployeeID
    description: >-
      Employee id for single object.
    type: string
    required: true
