name: xero_nz_get_pay_runs
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Retrieves pay runs. Xero API GET /payroll.xro/2.0/PayRuns.
api:
  method: GET
  path: /payroll.xro/2.0/PayRuns
  connector: xero
parameters:
  - name: page
    description: >-
      Page number which specifies the set of records to retrieve. By default the number of the records per set is 100.
    type: int
  - name: status
    description: >-
      By default get payruns will return all the payruns for an organisation. You can add GET https://api.xero.com/payroll.xro/2.0/payRuns?statu={PayRunStatus} to filter the payruns by status. One of: Draft, Posted.
    type: string
