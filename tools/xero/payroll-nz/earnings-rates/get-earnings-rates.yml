name: xero_nz_get_earnings_rates
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Retrieves earnings rates. Xero API GET /payroll.xro/2.0/EarningsRates.
api:
  method: GET
  path: /payroll.xro/2.0/EarningsRates
  connector: xero
parameters:
  - name: page
    description: >-
      Page number which specifies the set of records to retrieve. By default the number of the records per set is 100.
    type: int
