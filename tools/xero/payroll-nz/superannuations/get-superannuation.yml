name: xero_nz_get_superannuation
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Retrieves a specific superannuation using a unique superannuation ID. Xero API GET /payroll.xro/2.0/Superannuations/{SuperannuationID}.
api:
  method: GET
  path: /payroll.xro/2.0/Superannuations/{SuperannuationID}
  connector: xero
parameters:
  - name: SuperannuationID
    description: >-
      Identifier for the superannuation.
    type: string
    required: true
