name: xero_nz_get_tracking_categories
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Retrieves tracking categories. Xero API GET /payroll.xro/2.0/Settings/TrackingCategories.
api:
  method: GET
  path: /payroll.xro/2.0/Settings/TrackingCategories
  connector: xero
