name: xero_nz_get_timesheet
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Retrieves a specific timesheet by using a unique timesheet ID. Xero API GET /payroll.xro/2.0/Timesheets/{TimesheetID}.
api:
  method: GET
  path: /payroll.xro/2.0/Timesheets/{TimesheetID}
  connector: xero
parameters:
  - name: TimesheetID
    description: >-
      Identifier for the timesheet.
    type: string
    required: true
