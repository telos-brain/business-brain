name: xero_nz_approve_timesheet
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Approves a timesheet. Xero API POST /payroll.xro/2.0/Timesheets/{TimesheetID}/Approve.
api:
  method: POST
  path: /payroll.xro/2.0/Timesheets/{TimesheetID}/Approve
  connector: xero
parameters:
  - name: TimesheetID
    description: >-
      Identifier for the timesheet.
    type: string
    required: true
