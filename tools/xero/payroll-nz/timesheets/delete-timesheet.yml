name: xero_nz_delete_timesheet
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Deletes a timesheet. Xero API DELETE /payroll.xro/2.0/Timesheets/{TimesheetID}.
api:
  method: DELETE
  path: /payroll.xro/2.0/Timesheets/{TimesheetID}
  connector: xero
parameters:
  - name: TimesheetID
    description: >-
      Identifier for the timesheet.
    type: string
    required: true
