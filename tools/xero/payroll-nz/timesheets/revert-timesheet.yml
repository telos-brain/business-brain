name: xero_nz_revert_timesheet
version: 1
description: >-
  Xero Payroll New Zealand (payroll.xro/2.0). Use only for a New Zealand organisation. Reverts a timesheet to draft. Xero API POST /payroll.xro/2.0/Timesheets/{TimesheetID}/RevertToDraft.
api:
  method: POST
  path: /payroll.xro/2.0/Timesheets/{TimesheetID}/RevertToDraft
  connector: xero
parameters:
  - name: TimesheetID
    description: >-
      Identifier for the timesheet.
    type: string
    required: true
