name: xero_get_item
version: 1
description: >-
  Retrieves a specific item using a unique item Id. Xero API GET /api.xro/2.0/Items/{ItemID}.
api:
  method: GET
  path: /api.xro/2.0/Items/{ItemID}
  connector: xero
parameters:
  - name: ItemID
    description: >-
      Unique identifier for an Item.
    type: string
    required: true
  - name: unitdp
    description: >-
      e.g. unitdp=4 – (Unit Decimal Places) You can opt in to use four decimal places for unit amounts.
    type: int
