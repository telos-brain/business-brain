name: xero_delete_item
version: 1
description: >-
  Deletes a specific item. Xero API DELETE /api.xro/2.0/Items/{ItemID}.
api:
  method: DELETE
  path: /api.xro/2.0/Items/{ItemID}
  connector: xero
parameters:
  - name: ItemID
    description: >-
      Unique identifier for an Item.
    type: string
    required: true
