name: xero_get_contact_attachment_by_id
version: 1
description: >-
  Retrieves a specific attachment from a specific contact using a unique attachment Id. Xero API GET /api.xro/2.0/Contacts/{ContactID}/Attachments/{AttachmentID}.
api:
  method: GET
  path: /api.xro/2.0/Contacts/{ContactID}/Attachments/{AttachmentID}
  connector: xero
parameters:
  - name: ContactID
    description: >-
      Unique identifier for a Contact.
    type: string
    required: true
  - name: AttachmentID
    description: >-
      Unique identifier for Attachment object.
    type: string
    required: true
