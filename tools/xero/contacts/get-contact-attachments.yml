name: xero_get_contact_attachments
version: 1
description: >-
  Retrieves attachments for a specific contact in a Xero organisation. Xero API GET /api.xro/2.0/Contacts/{ContactID}/Attachments.
api:
  method: GET
  path: /api.xro/2.0/Contacts/{ContactID}/Attachments
  connector: xero
parameters:
  - name: ContactID
    description: >-
      Unique identifier for a Contact.
    type: string
    required: true
