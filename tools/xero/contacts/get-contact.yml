name: xero_get_contact
version: 1
description: >-
  Retrieves a specific contacts in a Xero organisation using a unique contact Id. Xero API GET /api.xro/2.0/Contacts/{ContactID}.
api:
  method: GET
  path: /api.xro/2.0/Contacts/{ContactID}
  connector: xero
parameters:
  - name: ContactID
    description: >-
      Unique identifier for a Contact.
    type: string
    required: true
