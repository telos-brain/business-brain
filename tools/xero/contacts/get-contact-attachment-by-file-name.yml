name: xero_get_contact_attachment_by_file_name
version: 1
description: >-
  Retrieves a specific attachment from a specific contact by file name. Xero API GET /api.xro/2.0/Contacts/{ContactID}/Attachments/{FileName}.
api:
  method: GET
  path: /api.xro/2.0/Contacts/{ContactID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: ContactID
    description: >-
      Unique identifier for a Contact.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
