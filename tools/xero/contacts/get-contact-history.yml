name: xero_get_contact_history
version: 1
description: >-
  Retrieves history records for a specific contact. Xero API GET /api.xro/2.0/Contacts/{ContactID}/History.
api:
  method: GET
  path: /api.xro/2.0/Contacts/{ContactID}/History
  connector: xero
parameters:
  - name: ContactID
    description: >-
      Unique identifier for a Contact.
    type: string
    required: true
