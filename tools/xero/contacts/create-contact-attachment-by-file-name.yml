name: xero_create_contact_attachment_by_file_name
version: 1
description: >-
  createContactAttachmentByFileName. Xero API PUT /api.xro/2.0/Contacts/{ContactID}/Attachments/{FileName}.
api:
  method: PUT
  path: /api.xro/2.0/Contacts/{ContactID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: ContactID
    description: >-
      Unique identifier for a Contact.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
  - name: file
    description: >-
      Raw file bytes. The Xero API expects application/octet-stream. Include the file name in the path.
    type: string
    required: true
