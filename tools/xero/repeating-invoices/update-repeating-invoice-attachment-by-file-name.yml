name: xero_update_repeating_invoice_attachment_by_file_name
version: 1
description: >-
  Updates a specific attachment from a specific repeating invoices by file name. Xero API POST /api.xro/2.0/RepeatingInvoices/{RepeatingInvoiceID}/Attachments/{FileName}.
api:
  method: POST
  path: /api.xro/2.0/RepeatingInvoices/{RepeatingInvoiceID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: RepeatingInvoiceID
    description: >-
      Unique identifier for a Repeating Invoice.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
  - name: file
    description: >-
      Raw file bytes. The Xero API expects application/octet-stream. Include the file name in the path.
    type: string
    required: true
