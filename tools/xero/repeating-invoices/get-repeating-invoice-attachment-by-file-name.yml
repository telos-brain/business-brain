name: xero_get_repeating_invoice_attachment_by_file_name
version: 1
description: >-
  Retrieves a specific attachment from a specific repeating invoices by file name. Xero API GET /api.xro/2.0/RepeatingInvoices/{RepeatingInvoiceID}/Attachments/{FileName}.
api:
  method: GET
  path: /api.xro/2.0/RepeatingInvoices/{RepeatingInvoiceID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: RepeatingInvoiceID
    description: >-
      Unique identifier for a Repeating Invoice.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
