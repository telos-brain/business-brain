name: xero_get_repeating_invoice_attachment_by_id
version: 1
description: >-
  Retrieves a specific attachment from a specific repeating invoice. Xero API GET /api.xro/2.0/RepeatingInvoices/{RepeatingInvoiceID}/Attachments/{AttachmentID}.
api:
  method: GET
  path: /api.xro/2.0/RepeatingInvoices/{RepeatingInvoiceID}/Attachments/{AttachmentID}
  connector: xero
parameters:
  - name: RepeatingInvoiceID
    description: >-
      Unique identifier for a Repeating Invoice.
    type: string
    required: true
  - name: AttachmentID
    description: >-
      Unique identifier for Attachment object.
    type: string
    required: true
