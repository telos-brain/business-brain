name: xero_au_v2_revert_timesheet
version: 1
description: >-
  Xero Payroll Australia timesheets v2 (payroll.xro/2.0). Use for Australian timesheet lines, approve, and revert. Do not use for New Zealand or the United Kingdom. Reverts a specific timesheet to draft. Xero API POST /payroll.xro/2.0/Timesheets/{TimesheetID}/RevertToDraft.
api:
  method: POST
  path: /payroll.xro/2.0/Timesheets/{TimesheetID}/RevertToDraft
  connector: xero
parameters:
  - name: TimesheetID
    description: >-
      Identifier for the timesheet.
    type: string
    required: true
