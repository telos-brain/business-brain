name: xero_au_v2_delete_timesheet_line
version: 1
description: >-
  Xero Payroll Australia timesheets v2 (payroll.xro/2.0). Use for Australian timesheet lines, approve, and revert. Do not use for New Zealand or the United Kingdom. Deletes a specific timesheet line. Xero API DELETE /payroll.xro/2.0/Timesheets/{TimesheetID}/Lines/{TimesheetLineID}.
api:
  method: DELETE
  path: /payroll.xro/2.0/Timesheets/{TimesheetID}/Lines/{TimesheetLineID}
  connector: xero
parameters:
  - name: TimesheetID
    description: >-
      Identifier for the timesheet.
    type: string
    required: true
  - name: TimesheetLineID
    description: >-
      Identifier for the timesheet line.
    type: string
    required: true
