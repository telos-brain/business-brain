name: xero_au_v2_delete_timesheet
version: 1
description: >-
  Xero Payroll Australia timesheets v2 (payroll.xro/2.0). Use for Australian timesheet lines, approve, and revert. Do not use for New Zealand or the United Kingdom. Deletes a specific timesheet. Xero API DELETE /payroll.xro/2.0/Timesheets/{TimesheetID}.
api:
  method: DELETE
  path: /payroll.xro/2.0/Timesheets/{TimesheetID}
  connector: xero
parameters:
  - name: TimesheetID
    description: >-
      Identifier for the timesheet.
    type: string
    required: true
