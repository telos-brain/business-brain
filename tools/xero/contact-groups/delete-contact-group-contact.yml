name: xero_delete_contact_group_contact
version: 1
description: >-
  Deletes a specific contact from a contact group using a unique contact Id. Xero API DELETE /api.xro/2.0/ContactGroups/{ContactGroupID}/Contacts/{ContactID}.
api:
  method: DELETE
  path: /api.xro/2.0/ContactGroups/{ContactGroupID}/Contacts/{ContactID}
  connector: xero
parameters:
  - name: ContactGroupID
    description: >-
      Unique identifier for a Contact Group.
    type: string
    required: true
  - name: ContactID
    description: >-
      Unique identifier for a Contact.
    type: string
    required: true
