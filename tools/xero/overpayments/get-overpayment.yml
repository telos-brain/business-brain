name: xero_get_overpayment
version: 1
description: >-
  Retrieves a specific overpayment using a unique overpayment Id. Xero API GET /api.xro/2.0/Overpayments/{OverpaymentID}.
api:
  method: GET
  path: /api.xro/2.0/Overpayments/{OverpaymentID}
  connector: xero
parameters:
  - name: OverpaymentID
    description: >-
      Unique identifier for a Overpayment.
    type: string
    required: true
