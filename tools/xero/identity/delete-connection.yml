name: xero_delete_connection
version: 1
description: >-
  Deletes a connection for this user (i.e. disconnect a tenant). Xero API DELETE /Connections/{id}.
api:
  method: DELETE
  path: /Connections/{id}
  connector: xero
parameters:
  - name: id
    description: >-
      Unique identifier for retrieving single object.
    type: string
    required: true
