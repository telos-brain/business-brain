name: xero_create_payment_service
version: 1
description: >-
  Creates a payment service. Xero API PUT /api.xro/2.0/PaymentServices.
api:
  method: PUT
  path: /api.xro/2.0/PaymentServices
  connector: xero
parameters:
  - name: PaymentServices
    description: >-
      Pass as a JSON array. Each item may include: PaymentServiceID (string): Xero identifier; PaymentServiceName (string): Name of payment service; PaymentServiceUrl (string): The custom payment URL; PayNowText (string): The text displayed on the Pay Now button in Xero Online Invoicing. If this is not set it will default to Pay by credit card; PaymentServiceType (string): This will always be CUSTOM for payment services created via the API.
    type: json