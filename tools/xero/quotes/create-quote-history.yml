name: xero_create_quote_history
version: 1
description: >-
  Creates a history record for a specific quote. Xero API PUT /api.xro/2.0/Quotes/{QuoteID}/History.
api:
  method: PUT
  path: /api.xro/2.0/Quotes/{QuoteID}/History
  connector: xero
parameters:
  - name: QuoteID
    description: >-
      Unique identifier for an Quote.
    type: string
    required: true
  - name: HistoryRecords
    description: >-
      Pass as a JSON array. Each item may include: Details (string): details; Changes (string): Name of branding theme; User (string): has a value of 0; DateUTC (string): UTC timestamp of creation date of branding theme.
    type: json