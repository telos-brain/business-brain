name: xero_get_quote_attachment_by_id
version: 1
description: >-
  Retrieves a specific attachment from a specific quote using a unique attachment Id. Xero API GET /api.xro/2.0/Quotes/{QuoteID}/Attachments/{AttachmentID}.
api:
  method: GET
  path: /api.xro/2.0/Quotes/{QuoteID}/Attachments/{AttachmentID}
  connector: xero
parameters:
  - name: QuoteID
    description: >-
      Unique identifier for an Quote.
    type: string
    required: true
  - name: AttachmentID
    description: >-
      Unique identifier for Attachment object.
    type: string
    required: true
