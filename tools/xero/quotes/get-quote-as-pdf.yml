name: xero_get_quote_as_pdf
version: 1
description: >-
  Retrieves a specific quote as a PDF file using a unique quote Id. Xero API GET /api.xro/2.0/Quotes/{QuoteID}/pdf.
api:
  method: GET
  path: /api.xro/2.0/Quotes/{QuoteID}/pdf
  connector: xero
parameters:
  - name: QuoteID
    description: >-
      Unique identifier for an Quote.
    type: string
    required: true
