name: xero_update_quote
version: 1
description: >-
  Updates a specific quote. Xero API POST /api.xro/2.0/Quotes/{QuoteID}.
api:
  method: POST
  path: /api.xro/2.0/Quotes/{QuoteID}
  connector: xero
parameters:
  - name: QuoteID
    description: >-
      Unique identifier for an Quote.
    type: string
    required: true
  - name: Quotes
    description: >-
      Pass as a JSON array. Each item may include: QuoteID (string): QuoteID GUID is automatically generated and is returned after create or GET; QuoteNumber (string): Unique alpha numeric code identifying a quote (Max Length = 255); Reference (string): Additional reference number; Terms (string): Terms of the quote; Contact (object); LineItems (array): See LineItems; Date (string): Date quote was issued – YYYY-MM-DD. If the Date element is not specified it will default to the current date based on the timezone setting of the organisation; DateString (string): Date the quote was issued (YYYY-MM-DD); ExpiryDate (string): Date the quote expires – YYYY-MM-DD; ExpiryDateString (string): Date the quote expires – YYYY-MM-DD; Status (string) [DRAFT, SENT, DECLINED, ACCEPTED, INVOICED, DELETED]; CurrencyCode (string) [AED, AFN, ALL, AMD, ANG, AOA, ARS, AUD]; CurrencyRate (number): The currency rate for a multicurrency quote; SubTotal (number): Total of quote excluding taxes; TotalTax (number): Total tax on quote; Total (number): Total of Quote tax inclusive (i.e. SubTotal + TotalTax). This will be ignored if it doesn’t equal the sum of the LineAmounts; TotalDiscount (number): Total of discounts applied on the quote line items; Title (string): Title text for the quote and 6 more.
    type: json