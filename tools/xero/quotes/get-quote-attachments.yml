name: xero_get_quote_attachments
version: 1
description: >-
  Retrieves attachments for a specific quote. Xero API GET /api.xro/2.0/Quotes/{QuoteID}/Attachments.
api:
  method: GET
  path: /api.xro/2.0/Quotes/{QuoteID}/Attachments
  connector: xero
parameters:
  - name: QuoteID
    description: >-
      Unique identifier for an Quote.
    type: string
    required: true
