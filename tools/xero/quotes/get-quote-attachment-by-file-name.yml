name: xero_get_quote_attachment_by_file_name
version: 1
description: >-
  Retrieves a specific attachment from a specific quote by filename. Xero API GET /api.xro/2.0/Quotes/{QuoteID}/Attachments/{FileName}.
api:
  method: GET
  path: /api.xro/2.0/Quotes/{QuoteID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: QuoteID
    description: >-
      Unique identifier for an Quote.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
