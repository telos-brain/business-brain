name: xero_create_quote_attachment_by_file_name
version: 1
description: >-
  Creates attachment for a specific quote. Xero API PUT /api.xro/2.0/Quotes/{QuoteID}/Attachments/{FileName}.
api:
  method: PUT
  path: /api.xro/2.0/Quotes/{QuoteID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: QuoteID
    description: >-
      Unique identifier for an Quote.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
  - name: file
    description: >-
      Raw file bytes. The Xero API expects application/octet-stream. Include the file name in the path.
    type: string
    required: true
