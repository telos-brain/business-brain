name: xero_get_expense_claim_history
version: 1
description: >-
  Retrieves history records of a specific expense claim. Xero API GET /api.xro/2.0/ExpenseClaims/{ExpenseClaimID}/History.
api:
  method: GET
  path: /api.xro/2.0/ExpenseClaims/{ExpenseClaimID}/History
  connector: xero
parameters:
  - name: ExpenseClaimID
    description: >-
      Unique identifier for a ExpenseClaim.
    type: string
    required: true
