name: xero_update_bank_transaction
version: 1
description: >-
  Updates a single spent or received money transaction. Xero API POST /api.xro/2.0/BankTransactions/{BankTransactionID}.
api:
  method: POST
  path: /api.xro/2.0/BankTransactions/{BankTransactionID}
  connector: xero
parameters:
  - name: BankTransactionID
    description: >-
      Xero generated unique identifier for a bank transaction.
    type: string
    required: true
  - name: unitdp
    description: >-
      e.g. unitdp=4 – (Unit Decimal Places) You can opt in to use four decimal places for unit amounts.
    type: int
  - name: BankTransactions
    description: >-
      Pass as a JSON array. Each item may include: Type (string) [RECEIVE, RECEIVE-OVERPAYMENT, RECEIVE-PREPAYMENT, SPEND, SPEND-OVERPAYMENT, SPEND-PREPAYMENT, RECEIVE-TRANSFER, SPEND-TRANSFER]; Contact (object); LineItems (array): See LineItems; BankAccount (object); IsReconciled (boolean): Boolean to show if transaction is reconciled; Date (string): Date of transaction – YYYY-MM-DD; Reference (string): Reference for the transaction. Only supported for SPEND and RECEIVE transactions; CurrencyCode (string) [AED, AFN, ALL, AMD, ANG, AOA, ARS, AUD]; CurrencyRate (number): Exchange rate to base currency when money is spent or received. e.g.0.7500 Only used for bank transactions in non base currency. If this isn’t specified for non base currency accounts then either the user-defined rate (preference) or the XE.com day rate will be used. Setting currency is only supported on overpayments; Url (string): URL link to a source document – shown as “Go to App Name”; Status (string) [AUTHORISED, DELETED, VOIDED]; LineAmountTypes (string) [Exclusive, Inclusive, NoTax]; SubTotal (number): Total of bank transaction excluding taxes; TotalTax (number): Total tax on bank transaction; Total (number): Total of bank transaction tax inclusive; BankTransactionID (string): Xero generated unique identifier for bank transaction; PrepaymentID (string): Xero generated unique identifier for a Prepayment. This will be returned on BankTransactions with a Type of SPEND-PREPAYMENT or RECEIVE-PREPAYMENT; OverpaymentID (string): Xero generated unique identifier for an Overpayment. This will be returned on BankTransactions with a Type of SPEND-OVERPAYMENT or RECEIVE-OVERPAYMENT and 4 more.
    type: json