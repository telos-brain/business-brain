name: xero_update_bank_transaction_attachment_by_file_name
version: 1
description: >-
  Updates a specific attachment from a specific bank transaction by filename. Xero API POST /api.xro/2.0/BankTransactions/{BankTransactionID}/Attachments/{FileName}.
api:
  method: POST
  path: /api.xro/2.0/BankTransactions/{BankTransactionID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: BankTransactionID
    description: >-
      Xero generated unique identifier for a bank transaction.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
  - name: file
    description: >-
      Raw file bytes. The Xero API expects application/octet-stream. Include the file name in the path.
    type: string
    required: true
