name: xero_get_bank_transaction_attachment_by_file_name
version: 1
description: >-
  Retrieves a specific attachment from a specific bank transaction by filename. Xero API GET /api.xro/2.0/BankTransactions/{BankTransactionID}/Attachments/{FileName}.
api:
  method: GET
  path: /api.xro/2.0/BankTransactions/{BankTransactionID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: BankTransactionID
    description: >-
      Xero generated unique identifier for a bank transaction.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
