name: xero_get_bank_transaction
version: 1
description: >-
  Retrieves a single spent or received money transaction by using a unique bank transaction Id. Xero API GET /api.xro/2.0/BankTransactions/{BankTransactionID}.
api:
  method: GET
  path: /api.xro/2.0/BankTransactions/{BankTransactionID}
  connector: xero
parameters:
  - name: BankTransactionID
    description: >-
      Xero generated unique identifier for a bank transaction.
    type: string
    required: true
  - name: unitdp
    description: >-
      e.g. unitdp=4 – (Unit Decimal Places) You can opt in to use four decimal places for unit amounts.
    type: int
