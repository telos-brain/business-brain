name: xero_get_bank_transaction_attachment_by_id
version: 1
description: >-
  Retrieves specific attachments from a specific BankTransaction using a unique attachment Id. Xero API GET /api.xro/2.0/BankTransactions/{BankTransactionID}/Attachments/{AttachmentID}.
api:
  method: GET
  path: /api.xro/2.0/BankTransactions/{BankTransactionID}/Attachments/{AttachmentID}
  connector: xero
parameters:
  - name: BankTransactionID
    description: >-
      Xero generated unique identifier for a bank transaction.
    type: string
    required: true
  - name: AttachmentID
    description: >-
      Unique identifier for Attachment object.
    type: string
    required: true
