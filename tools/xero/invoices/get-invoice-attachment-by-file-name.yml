name: xero_get_invoice_attachment_by_file_name
version: 1
description: >-
  Retrieves an attachment from a specific invoice or purchase bill by filename. Xero API GET /api.xro/2.0/Invoices/{InvoiceID}/Attachments/{FileName}.
api:
  method: GET
  path: /api.xro/2.0/Invoices/{InvoiceID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: InvoiceID
    description: >-
      Unique identifier for an Invoice.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
