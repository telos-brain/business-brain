name: xero_update_invoice_attachment_by_file_name
version: 1
description: >-
  Updates an attachment from a specific invoices or purchase bill by filename. Xero API POST /api.xro/2.0/Invoices/{InvoiceID}/Attachments/{FileName}.
api:
  method: POST
  path: /api.xro/2.0/Invoices/{InvoiceID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: InvoiceID
    description: >-
      Unique identifier for an Invoice.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
  - name: file
    description: >-
      Raw file bytes. The Xero API expects application/octet-stream. Include the file name in the path.
    type: string
    required: true
