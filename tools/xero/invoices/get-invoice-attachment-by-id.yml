name: xero_get_invoice_attachment_by_id
version: 1
description: >-
  Retrieves a specific attachment from a specific invoices or purchase bills by using a unique attachment Id. Xero API GET /api.xro/2.0/Invoices/{InvoiceID}/Attachments/{AttachmentID}.
api:
  method: GET
  path: /api.xro/2.0/Invoices/{InvoiceID}/Attachments/{AttachmentID}
  connector: xero
parameters:
  - name: InvoiceID
    description: >-
      Unique identifier for an Invoice.
    type: string
    required: true
  - name: AttachmentID
    description: >-
      Unique identifier for Attachment object.
    type: string
    required: true
