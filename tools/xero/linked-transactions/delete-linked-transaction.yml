name: xero_delete_linked_transaction
version: 1
description: >-
  Deletes a specific linked transactions (billable expenses). Xero API DELETE /api.xro/2.0/LinkedTransactions/{LinkedTransactionID}.
api:
  method: DELETE
  path: /api.xro/2.0/LinkedTransactions/{LinkedTransactionID}
  connector: xero
parameters:
  - name: LinkedTransactionID
    description: >-
      Unique identifier for a LinkedTransaction.
    type: string
    required: true
