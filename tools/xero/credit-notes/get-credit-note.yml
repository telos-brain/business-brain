name: xero_get_credit_note
version: 1
description: >-
  Retrieves a specific credit note using a unique credit note Id. Xero API GET /api.xro/2.0/CreditNotes/{CreditNoteID}.
api:
  method: GET
  path: /api.xro/2.0/CreditNotes/{CreditNoteID}
  connector: xero
parameters:
  - name: CreditNoteID
    description: >-
      Unique identifier for a Credit Note.
    type: string
    required: true
  - name: unitdp
    description: >-
      e.g. unitdp=4 – (Unit Decimal Places) You can opt in to use four decimal places for unit amounts.
    type: int
