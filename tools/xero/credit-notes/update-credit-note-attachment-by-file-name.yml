name: xero_update_credit_note_attachment_by_file_name
version: 1
description: >-
  Updates attachments on a specific credit note by file name. Xero API POST /api.xro/2.0/CreditNotes/{CreditNoteID}/Attachments/{FileName}.
api:
  method: POST
  path: /api.xro/2.0/CreditNotes/{CreditNoteID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: CreditNoteID
    description: >-
      Unique identifier for a Credit Note.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
  - name: file
    description: >-
      Raw file bytes. The Xero API expects application/octet-stream. Include the file name in the path.
    type: string
    required: true
