name: xero_get_credit_notes
version: 1
description: >-
  Retrieves any credit notes. Xero API GET /api.xro/2.0/CreditNotes.
api:
  method: GET
  path: /api.xro/2.0/CreditNotes
  connector: xero
parameters:
  - name: where
    description: >-
      Xero where filter, e.g. Status=="AUTHORISED" AND Type=="ACCREC". See https://developer.xero.com/documentation/guides/how-to-guides/filtering
    type: string
  - name: order
    description: >-
      Sort expression, e.g. Date DESC or InvoiceNumber.
    type: string
  - name: page
    description: >-
      e.g. page=1 – Up to 100 credit notes will be returned in a single API call with line items shown for each credit note.
    type: int
  - name: unitdp
    description: >-
      e.g. unitdp=4 – (Unit Decimal Places) You can opt in to use four decimal places for unit amounts.
    type: int
  - name: pageSize
    description: >-
      Number of records to retrieve per page.
    type: int
