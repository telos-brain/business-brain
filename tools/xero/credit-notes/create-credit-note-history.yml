name: xero_create_credit_note_history
version: 1
description: >-
  Retrieves history records of a specific credit note. Xero API PUT /api.xro/2.0/CreditNotes/{CreditNoteID}/History.
api:
  method: PUT
  path: /api.xro/2.0/CreditNotes/{CreditNoteID}/History
  connector: xero
parameters:
  - name: CreditNoteID
    description: >-
      Unique identifier for a Credit Note.
    type: string
    required: true
  - name: HistoryRecords
    description: >-
      Pass as a JSON array. Each item may include: Details (string): details; Changes (string): Name of branding theme; User (string): has a value of 0; DateUTC (string): UTC timestamp of creation date of branding theme.
    type: json