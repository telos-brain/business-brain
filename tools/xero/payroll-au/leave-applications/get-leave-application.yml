name: xero_au_get_leave_application
version: 1
description: >-
  Xero Payroll Australia (payroll.xro/1.0). Use only for an Australian organisation. Retrieves a leave application by a unique leave application id. Xero API GET /payroll.xro/1.0/LeaveApplications/{LeaveApplicationID}.
api:
  method: GET
  path: /payroll.xro/1.0/LeaveApplications/{LeaveApplicationID}
  connector: xero
parameters:
  - name: LeaveApplicationID
    description: >-
      Leave Application id for single object.
    type: string
    required: true
