name: xero_au_get_payslip
version: 1
description: >-
  Xero Payroll Australia (payroll.xro/1.0). Use only for an Australian organisation. Retrieves for a payslip by a unique payslip id. Xero API GET /payroll.xro/1.0/Payslip/{PayslipID}.
api:
  method: GET
  path: /payroll.xro/1.0/Payslip/{PayslipID}
  connector: xero
parameters:
  - name: PayslipID
    description: >-
      Payslip id for single object.
    type: string
    required: true
