name: xero_au_get_pay_run
version: 1
description: >-
  Xero Payroll Australia (payroll.xro/1.0). Use only for an Australian organisation. Retrieves a pay run by using a unique pay run id. Xero API GET /payroll.xro/1.0/PayRuns/{PayRunID}.
api:
  method: GET
  path: /payroll.xro/1.0/PayRuns/{PayRunID}
  connector: xero
parameters:
  - name: PayRunID
    description: >-
      PayRun id for single object.
    type: string
    required: true
