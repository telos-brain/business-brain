name: xero_get_bank_transfer_history
version: 1
description: >-
  Retrieves history from a specific bank transfer using a unique bank transfer Id. Xero API GET /api.xro/2.0/BankTransfers/{BankTransferID}/History.
api:
  method: GET
  path: /api.xro/2.0/BankTransfers/{BankTransferID}/History
  connector: xero
parameters:
  - name: BankTransferID
    description: >-
      Xero generated unique identifier for a bank transfer.
    type: string
    required: true
