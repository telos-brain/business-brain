name: xero_create_bank_transfer_history_record
version: 1
description: >-
  Creates a history record for a specific bank transfer. Xero API PUT /api.xro/2.0/BankTransfers/{BankTransferID}/History.
api:
  method: PUT
  path: /api.xro/2.0/BankTransfers/{BankTransferID}/History
  connector: xero
parameters:
  - name: BankTransferID
    description: >-
      Xero generated unique identifier for a bank transfer.
    type: string
    required: true
  - name: HistoryRecords
    description: >-
      Pass as a JSON array. Each item may include: Details (string): details; Changes (string): Name of branding theme; User (string): has a value of 0; DateUTC (string): UTC timestamp of creation date of branding theme.
    type: json