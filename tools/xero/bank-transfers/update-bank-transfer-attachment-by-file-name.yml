name: xero_update_bank_transfer_attachment_by_file_name
version: 1
description: >-
  updateBankTransferAttachmentByFileName. Xero API POST /api.xro/2.0/BankTransfers/{BankTransferID}/Attachments/{FileName}.
api:
  method: POST
  path: /api.xro/2.0/BankTransfers/{BankTransferID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: BankTransferID
    description: >-
      Xero generated unique identifier for a bank transfer.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
  - name: file
    description: >-
      Raw file bytes. The Xero API expects application/octet-stream. Include the file name in the path.
    type: string
    required: true
