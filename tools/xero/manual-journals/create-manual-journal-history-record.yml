name: xero_create_manual_journal_history_record
version: 1
description: >-
  Creates a history record for a specific manual journal. Xero API PUT /api.xro/2.0/ManualJournals/{ManualJournalID}/History.
api:
  method: PUT
  path: /api.xro/2.0/ManualJournals/{ManualJournalID}/History
  connector: xero
parameters:
  - name: ManualJournalID
    description: >-
      Unique identifier for a ManualJournal.
    type: string
    required: true
  - name: HistoryRecords
    description: >-
      Pass as a JSON array. Each item may include: Details (string): details; Changes (string): Name of branding theme; User (string): has a value of 0; DateUTC (string): UTC timestamp of creation date of branding theme.
    type: json