name: xero_get_manual_journal_attachment_by_file_name
version: 1
description: >-
  Retrieves a specific attachment from a specific manual journal by file name. Xero API GET /api.xro/2.0/ManualJournals/{ManualJournalID}/Attachments/{FileName}.
api:
  method: GET
  path: /api.xro/2.0/ManualJournals/{ManualJournalID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: ManualJournalID
    description: >-
      Unique identifier for a ManualJournal.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
