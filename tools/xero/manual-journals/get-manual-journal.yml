name: xero_get_manual_journal
version: 1
description: >-
  Retrieves a specific manual journal. Xero API GET /api.xro/2.0/ManualJournals/{ManualJournalID}.
api:
  method: GET
  path: /api.xro/2.0/ManualJournals/{ManualJournalID}
  connector: xero
parameters:
  - name: ManualJournalID
    description: >-
      Unique identifier for a ManualJournal.
    type: string
    required: true
