name: xero_update_manual_journal_attachment_by_file_name
version: 1
description: >-
  Updates a specific attachment from a specific manual journal by file name. Xero API POST /api.xro/2.0/ManualJournals/{ManualJournalID}/Attachments/{FileName}.
api:
  method: POST
  path: /api.xro/2.0/ManualJournals/{ManualJournalID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: ManualJournalID
    description: >-
      Unique identifier for a ManualJournal.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
  - name: file
    description: >-
      Raw file bytes. The Xero API expects application/octet-stream. Include the file name in the path.
    type: string
    required: true
