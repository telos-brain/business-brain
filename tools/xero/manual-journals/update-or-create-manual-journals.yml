name: xero_update_or_create_manual_journals
version: 1
description: >-
  Updates or creates a single manual journal. Xero API POST /api.xro/2.0/ManualJournals.
api:
  method: POST
  path: /api.xro/2.0/ManualJournals
  connector: xero
parameters:
  - name: summarizeErrors
    description: >-
      If false return 200 OK and mix of successfully created objects and any with validation errors. Use true or false.
    type: string
  - name: ManualJournals
    description: >-
      Pass as a JSON array. Each item may include: Narration (string): Description of journal being posted; JournalLines (array): See JournalLines; Date (string): Date journal was posted – YYYY-MM-DD; LineAmountTypes (string) [Exclusive, Inclusive, NoTax]; Status (string) [DRAFT, POSTED, DELETED, VOIDED, ARCHIVED]; Url (string): Url link to a source document – shown as “Go to [appName]” in the Xero app; ShowOnCashBasisReports (boolean): Boolean – default is true if not specified; ManualJournalID (string): The Xero identifier for a Manual Journal; StatusAttributeString (string): A string to indicate if a invoice status; Attachments (array): Displays array of attachments from the API.
    type: json