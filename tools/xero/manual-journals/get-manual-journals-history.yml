name: xero_get_manual_journals_history
version: 1
description: >-
  Retrieves history for a specific manual journal. Xero API GET /api.xro/2.0/ManualJournals/{ManualJournalID}/History.
api:
  method: GET
  path: /api.xro/2.0/ManualJournals/{ManualJournalID}/History
  connector: xero
parameters:
  - name: ManualJournalID
    description: >-
      Unique identifier for a ManualJournal.
    type: string
    required: true
