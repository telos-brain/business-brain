name: xero_delete_tracking_category
version: 1
description: >-
  Deletes a specific tracking category. Xero API DELETE /api.xro/2.0/TrackingCategories/{TrackingCategoryID}.
api:
  method: DELETE
  path: /api.xro/2.0/TrackingCategories/{TrackingCategoryID}
  connector: xero
parameters:
  - name: TrackingCategoryID
    description: >-
      Unique identifier for a TrackingCategory.
    type: string
    required: true
