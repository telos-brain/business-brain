name: xero_create_account_attachment_by_file_name
version: 1
description: >-
  Creates an attachment on a specific account. Xero API PUT /api.xro/2.0/Accounts/{AccountID}/Attachments/{FileName}.
api:
  method: PUT
  path: /api.xro/2.0/Accounts/{AccountID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: AccountID
    description: >-
      Unique identifier for Account object.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
  - name: file
    description: >-
      Raw file bytes. The Xero API expects application/octet-stream. Include the file name in the path.
    type: string
    required: true
