name: xero_get_account
version: 1
description: >-
  Retrieves a single chart of accounts by using a unique account Id. Xero API GET /api.xro/2.0/Accounts/{AccountID}.
api:
  method: GET
  path: /api.xro/2.0/Accounts/{AccountID}
  connector: xero
parameters:
  - name: AccountID
    description: >-
      Unique identifier for Account object.
    type: string
    required: true
