name: xero_get_account_attachment_by_file_name
version: 1
description: >-
  Retrieves an attachment for a specific account by filename. Xero API GET /api.xro/2.0/Accounts/{AccountID}/Attachments/{FileName}.
api:
  method: GET
  path: /api.xro/2.0/Accounts/{AccountID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: AccountID
    description: >-
      Unique identifier for Account object.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
