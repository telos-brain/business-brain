name: xero_get_account_attachments
version: 1
description: >-
  Retrieves attachments for a specific accounts by using a unique account Id. Xero API GET /api.xro/2.0/Accounts/{AccountID}/Attachments.
api:
  method: GET
  path: /api.xro/2.0/Accounts/{AccountID}/Attachments
  connector: xero
parameters:
  - name: AccountID
    description: >-
      Unique identifier for Account object.
    type: string
    required: true
