name: xero_get_journals
version: 1
description: >-
  Retrieves journals. Xero API GET /api.xro/2.0/Journals.
api:
  method: GET
  path: /api.xro/2.0/Journals
  connector: xero
parameters:
  - name: offset
    description: >-
      Offset by a specified journal number. e.g. journals with a JournalNumber greater than the offset will be returned.
    type: int
  - name: paymentsOnly
    description: >-
      Filter to retrieve journals on a cash basis. Journals are returned on an accrual basis by default. Use true or false.
    type: string
