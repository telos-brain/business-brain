name: xero_get_users
version: 1
description: >-
  Retrieves users. Xero API GET /api.xro/2.0/Users.
api:
  method: GET
  path: /api.xro/2.0/Users
  connector: xero
parameters:
  - name: where
    description: >-
      Xero where filter, e.g. Status=="AUTHORISED" AND Type=="ACCREC". See https://developer.xero.com/documentation/guides/how-to-guides/filtering
    type: string
  - name: order
    description: >-
      Sort expression, e.g. Date DESC or InvoiceNumber.
    type: string
