name: xero_create_payment_history
version: 1
description: >-
  Creates a history record for a specific payment. Xero API PUT /api.xro/2.0/Payments/{PaymentID}/History.
api:
  method: PUT
  path: /api.xro/2.0/Payments/{PaymentID}/History
  connector: xero
parameters:
  - name: PaymentID
    description: >-
      Unique identifier for a Payment.
    type: string
    required: true
  - name: HistoryRecords
    description: >-
      Pass as a JSON array. Each item may include: Details (string): details; Changes (string): Name of branding theme; User (string): has a value of 0; DateUTC (string): UTC timestamp of creation date of branding theme.
    type: json