name: xero_uk_create_employee_salary_and_wage
version: 1
description: >-
  Xero Payroll United Kingdom (payroll.xro/2.0). Use only for a United Kingdom organisation. Creates a salary and wage record for a specific employee. Xero API POST /payroll.xro/2.0/Employees/{EmployeeID}/SalaryAndWages.
api:
  method: POST
  path: /payroll.xro/2.0/Employees/{EmployeeID}/SalaryAndWages
  connector: xero
parameters:
  - name: EmployeeID
    description: >-
      Employee id for single object.
    type: string
    required: true
  - name: salaryAndWagesID
    description: >-
      Xero unique identifier for a salary and wages record.
    type: string
  - name: earningsRateID
    description: >-
      Xero unique identifier for an earnings rate.
    type: string
    required: true
  - name: numberOfUnitsPerWeek
    description: >-
      The Number of Units per week for the corresponding salary and wages.
    type: decimal
    required: true
  - name: ratePerUnit
    description: >-
      The rate of each unit for the corresponding salary and wages.
    type: decimal
  - name: numberOfUnitsPerDay
    description: >-
      The Number of Units per day for the corresponding salary and wages.
    type: decimal
  - name: effectiveFrom
    description: >-
      The effective date of the corresponding salary and wages.
    type: date
    required: true
  - name: annualSalary
    description: >-
      The annual salary.
    type: decimal
    required: true
  - name: status
    description: >-
      The current status of the corresponding salary and wages. One of: Active, Pending, History.
    type: string
    required: true
  - name: paymentType
    description: >-
      The type of the payment of the corresponding salary and wages. One of: Salary, Hourly.
    type: string
    required: true
