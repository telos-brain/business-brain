name: xero_uk_get_employees
version: 1
description: >-
  Xero Payroll United Kingdom (payroll.xro/2.0). Use only for a United Kingdom organisation. Retrieves employees. Xero API GET /payroll.xro/2.0/Employees.
api:
  method: GET
  path: /payroll.xro/2.0/Employees
  connector: xero
parameters:
  - name: filter
    description: >-
      Filter by first name, lastname, and/or whether they are an off-payroll worker.
    type: string
  - name: page
    description: >-
      Page number which specifies the set of records to retrieve. By default the number of the records per set is 100.
    type: int
