name: xero_uk_get_employee_payment_method
version: 1
description: >-
  Xero Payroll United Kingdom (payroll.xro/2.0). Use only for a United Kingdom organisation. Retrieves a specific employee's payment method using a unique employee ID. Xero API GET /payroll.xro/2.0/Employees/{EmployeeID}/PaymentMethods.
api:
  method: GET
  path: /payroll.xro/2.0/Employees/{EmployeeID}/PaymentMethods
  connector: xero
parameters:
  - name: EmployeeID
    description: >-
      Employee id for single object.
    type: string
    required: true
