name: xero_uk_get_employee_leave_balances
version: 1
description: >-
  Xero Payroll United Kingdom (payroll.xro/2.0). Use only for a United Kingdom organisation. Retrieves a specific employee's leave balances using a unique employee ID. Xero API GET /payroll.xro/2.0/Employees/{EmployeeID}/LeaveBalances.
api:
  method: GET
  path: /payroll.xro/2.0/Employees/{EmployeeID}/LeaveBalances
  connector: xero
parameters:
  - name: EmployeeID
    description: >-
      Employee id for single object.
    type: string
    required: true
