name: xero_uk_get_employee_leave
version: 1
description: >-
  Xero Payroll United Kingdom (payroll.xro/2.0). Use only for a United Kingdom organisation. Retrieves a specific employee's leave record using a unique employee ID. Xero API GET /payroll.xro/2.0/Employees/{EmployeeID}/Leave/{LeaveID}.
api:
  method: GET
  path: /payroll.xro/2.0/Employees/{EmployeeID}/Leave/{LeaveID}
  connector: xero
parameters:
  - name: EmployeeID
    description: >-
      Employee id for single object.
    type: string
    required: true
  - name: LeaveID
    description: >-
      Leave id for single object.
    type: string
    required: true
