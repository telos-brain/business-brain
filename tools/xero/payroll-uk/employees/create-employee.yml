name: xero_uk_create_employee
version: 1
description: >-
  Xero Payroll United Kingdom (payroll.xro/2.0). Use only for a United Kingdom organisation. Creates employees. Xero API POST /payroll.xro/2.0/Employees.
api:
  method: POST
  path: /payroll.xro/2.0/Employees
  connector: xero
parameters:
  - name: employeeID
    description: >-
      Xero unique identifier for the employee.
    type: string
  - name: title
    description: >-
      Title of the employee.
    type: string
    required: true
  - name: firstName
    description: >-
      First name of employee.
    type: string
    required: true
  - name: lastName
    description: >-
      Last name of employee.
    type: string
    required: true
  - name: dateOfBirth
    description: >-
      Date of birth of the employee (YYYY-MM-DD).
    type: date
    required: true
  - name: address
    description: >-
      Pass as a JSON object. Fields: addressLine1 (string): Address line 1 for employee home address; addressLine2 (string): Address line 2 for employee home address; city (string): Suburb for employee home address; postCode (string): PostCode for employee home address; countryName (string): Country of HomeAddress.
    type: json
    required: true
  - name: email
    description: >-
      The email address for the employee.
    type: string
  - name: gender
    description: >-
      The employee’s gender. One of: M, F.
    type: string
    required: true
  - name: phoneNumber
    description: >-
      Employee phone number.
    type: string
  - name: startDate
    description: >-
      Employment start date of the employee at the time it was requested.
    type: date
  - name: endDate
    description: >-
      Employment end date of the employee at the time it was requested.
    type: date
  - name: payrollCalendarID
    description: >-
      Xero unique identifier for the payroll calendar of the employee.
    type: string
  - name: updatedDateUTC
    description: >-
      UTC timestamp of last update to the employee.
    type: datetime
  - name: createdDateUTC
    description: >-
      UTC timestamp when the employee was created in Xero.
    type: datetime
  - name: niCategory
    description: >-
      The employee's NI Category letter. One of: A, B, C, F, H, I, J, L, M, S, V, X, Z, D, E, K, N.
    type: string
  - name: niCategories
    description: >-
      The employee's NI categories. Pass as a JSON array. Each item may include: startDate (string): The start date of the NI category (YYYY-MM-DD); niCategory (string) [A, B, C, F, H, I, J, L]; niCategoryID (number): Xero unique identifier for the NI category; dateFirstEmployedAsCivilian (string): The date in which the employee was first employed as a civilian (YYYY-MM-DD); workplacePostcode (string): The workplace postcode.
    type: json
  - name: nationalInsuranceNumber
    description: >-
      National insurance number of the employee.
    type: string
  - name: isOffPayrollWorker
    description: >-
      Whether the employee is an off payroll worker. Use true or false.
    type: string
  - name: contracts
    description: >-
      The employee's contracts. Pass as a JSON array. Each item may include: startDate (string): The contract start date of the employee. This will be locked once an employee has been paid and cannot be changed (YYYY-MM-DD); employmentStatus (string) [Employee, Worker, Unspecified, OffPayrollWorker]; contractType (string) [FullTime, PartTime, ZeroHour, Unspecified]; publicKey (string): The public key of the contract. Public key is required if the intention is to edit an existing contract. If no key is supplied a new contract will be created; isFixedTerm (boolean): describes whether the contract is fixed term (required if trying to create Fixed term contract); fixedTermEndDate (string): The fixed term end date of the employee. Not required if isFixedTerm is false or not provided (required if trying to create Fixed term contract); developmentalRoleDetails (object).
    type: json
