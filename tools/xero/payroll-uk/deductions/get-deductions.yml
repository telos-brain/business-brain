name: xero_uk_get_deductions
version: 1
description: >-
  Xero Payroll United Kingdom (payroll.xro/2.0). Use only for a United Kingdom organisation. Retrieves deductions. Xero API GET /payroll.xro/2.0/Deductions.
api:
  method: GET
  path: /payroll.xro/2.0/Deductions
  connector: xero
parameters:
  - name: page
    description: >-
      Page number which specifies the set of records to retrieve. By default the number of the records per set is 100.
    type: int
