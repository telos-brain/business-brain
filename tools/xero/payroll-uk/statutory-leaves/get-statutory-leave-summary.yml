name: xero_uk_get_statutory_leave_summary
version: 1
description: >-
  Xero Payroll United Kingdom (payroll.xro/2.0). Use only for a United Kingdom organisation. Retrieves a specific employee's summary of statutory leaves using a unique employee ID. Xero API GET /payroll.xro/2.0/StatutoryLeaves/Summary/{EmployeeID}.
api:
  method: GET
  path: /payroll.xro/2.0/StatutoryLeaves/Summary/{EmployeeID}
  connector: xero
parameters:
  - name: EmployeeID
    description: >-
      Employee id for single object.
    type: string
    required: true
  - name: activeOnly
    description: >-
      Filter response with leaves that are currently active or yet to be taken. If not specified, all leaves (past, current, and future scheduled) are returned. Use true or false.
    type: string
