name: xero_uk_create_leave_type
version: 1
description: >-
  Xero Payroll United Kingdom (payroll.xro/2.0). Use only for a United Kingdom organisation. Creates a new leave type. Xero API POST /payroll.xro/2.0/LeaveTypes.
api:
  method: POST
  path: /payroll.xro/2.0/LeaveTypes
  connector: xero
parameters:
  - name: leaveID
    description: >-
      Xero unique identifier for the leave.
    type: string
  - name: leaveTypeID
    description: >-
      Xero unique identifier for the leave type.
    type: string
  - name: name
    description: >-
      Name of the leave type.
    type: string
    required: true
  - name: isPaidLeave
    description: >-
      Indicate that an employee will be paid when taking this type of leave. Use true or false.
    type: string
    required: true
  - name: showOnPayslip
    description: >-
      Indicate that a balance for this leave type to be shown on the employee’s payslips. Use true or false.
    type: string
    required: true
  - name: updatedDateUTC
    description: >-
      UTC timestamp of last update to the leave type note.
    type: datetime
  - name: isActive
    description: >-
      Shows whether the leave type is active or not. Use true or false.
    type: string
  - name: isStatutoryLeave
    description: >-
      Shows whether the leave type is a statutory leave type or not. Use true or false.
    type: string
