name: xero_uk_get_pay_slips
version: 1
description: >-
  Xero Payroll United Kingdom (payroll.xro/2.0). Use only for a United Kingdom organisation. Retrieves payslips. Xero API GET /payroll.xro/2.0/Payslips.
api:
  method: GET
  path: /payroll.xro/2.0/Payslips
  connector: xero
parameters:
  - name: page
    description: >-
      Page number which specifies the set of records to retrieve. By default the number of the records per set is 100.
    type: int
  - name: PayRunID
    description: >-
      PayrunID which specifies the containing payrun of payslips to retrieve. By default, the API does not group payslips by payrun.
    type: string
    required: true
