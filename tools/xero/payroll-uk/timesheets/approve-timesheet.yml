name: xero_uk_approve_timesheet
version: 1
description: >-
  Xero Payroll United Kingdom (payroll.xro/2.0). Use only for a United Kingdom organisation. Approves a specific timesheet. Xero API POST /payroll.xro/2.0/Timesheets/{TimesheetID}/Approve.
api:
  method: POST
  path: /payroll.xro/2.0/Timesheets/{TimesheetID}/Approve
  connector: xero
parameters:
  - name: TimesheetID
    description: >-
      Identifier for the timesheet.
    type: string
    required: true
