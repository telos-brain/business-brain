name: xero_uk_get_reimbursement
version: 1
description: >-
  Xero Payroll United Kingdom (payroll.xro/2.0). Use only for a United Kingdom organisation. Retrieves a specific reimbursement by using a unique reimbursement id. Xero API GET /payroll.xro/2.0/Reimbursements/{ReimbursementID}.
api:
  method: GET
  path: /payroll.xro/2.0/Reimbursements/{ReimbursementID}
  connector: xero
parameters:
  - name: ReimbursementID
    description: >-
      Identifier for the reimbursement.
    type: string
    required: true
