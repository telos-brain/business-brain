name: xero_get_branding_theme_payment_services
version: 1
description: >-
  Retrieves the payment services for a specific branding theme. Xero API GET /api.xro/2.0/BrandingThemes/{BrandingThemeID}/PaymentServices.
api:
  method: GET
  path: /api.xro/2.0/BrandingThemes/{BrandingThemeID}/PaymentServices
  connector: xero
parameters:
  - name: BrandingThemeID
    description: >-
      Unique identifier for a Branding Theme.
    type: string
    required: true
