name: xero_create_receipt_attachment_by_file_name
version: 1
description: >-
  Creates an attachment on a specific expense claim receipts by file name. Xero API PUT /api.xro/2.0/Receipts/{ReceiptID}/Attachments/{FileName}.
api:
  method: PUT
  path: /api.xro/2.0/Receipts/{ReceiptID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: ReceiptID
    description: >-
      Unique identifier for a Receipt.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
  - name: file
    description: >-
      Raw file bytes. The Xero API expects application/octet-stream. Include the file name in the path.
    type: string
    required: true
