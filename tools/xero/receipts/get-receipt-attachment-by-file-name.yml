name: xero_get_receipt_attachment_by_file_name
version: 1
description: >-
  Retrieves a specific attachment from a specific expense claim receipts by file name. Xero API GET /api.xro/2.0/Receipts/{ReceiptID}/Attachments/{FileName}.
api:
  method: GET
  path: /api.xro/2.0/Receipts/{ReceiptID}/Attachments/{FileName}
  connector: xero
parameters:
  - name: ReceiptID
    description: >-
      Unique identifier for a Receipt.
    type: string
    required: true
  - name: FileName
    description: >-
      Name of the attachment.
    type: string
    required: true
