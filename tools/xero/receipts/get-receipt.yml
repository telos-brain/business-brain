name: xero_get_receipt
version: 1
description: >-
  Retrieves a specific draft expense claim receipt by using a unique receipt Id. Xero API GET /api.xro/2.0/Receipts/{ReceiptID}.
api:
  method: GET
  path: /api.xro/2.0/Receipts/{ReceiptID}
  connector: xero
parameters:
  - name: ReceiptID
    description: >-
      Unique identifier for a Receipt.
    type: string
    required: true
  - name: unitdp
    description: >-
      e.g. unitdp=4 – (Unit Decimal Places) You can opt in to use four decimal places for unit amounts.
    type: int
