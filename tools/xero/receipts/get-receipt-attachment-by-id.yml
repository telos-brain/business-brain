name: xero_get_receipt_attachment_by_id
version: 1
description: >-
  Retrieves a specific attachments from a specific expense claim receipts by using a unique attachment Id. Xero API GET /api.xro/2.0/Receipts/{ReceiptID}/Attachments/{AttachmentID}.
api:
  method: GET
  path: /api.xro/2.0/Receipts/{ReceiptID}/Attachments/{AttachmentID}
  connector: xero
parameters:
  - name: ReceiptID
    description: >-
      Unique identifier for a Receipt.
    type: string
    required: true
  - name: AttachmentID
    description: >-
      Unique identifier for Attachment object.
    type: string
    required: true
