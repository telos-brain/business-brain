name: xero_get_report_aged_payables_by_contact
version: 1
description: >-
  Retrieves report for aged payables by contact. Xero API GET /api.xro/2.0/Reports/AgedPayablesByContact.
api:
  method: GET
  path: /api.xro/2.0/Reports/AgedPayablesByContact
  connector: xero
parameters:
  - name: contactId
    description: >-
      Unique identifier for a Contact.
    type: string
    required: true
  - name: date
    description: >-
      The date of the Aged Payables By Contact report.
    type: date
  - name: fromDate
    description: >-
      filter by the from date of the report e.g. 2021-02-01.
    type: date
  - name: toDate
    description: >-
      filter by the to date of the report e.g. 2021-02-28.
    type: date
