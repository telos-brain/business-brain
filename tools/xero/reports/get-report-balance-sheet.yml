name: xero_get_report_balance_sheet
version: 1
description: >-
  Retrieves report for balancesheet. Xero API GET /api.xro/2.0/Reports/BalanceSheet.
api:
  method: GET
  path: /api.xro/2.0/Reports/BalanceSheet
  connector: xero
parameters:
  - name: date
    description: >-
      The date of the Balance Sheet report.
    type: date
  - name: periods
    description: >-
      The number of periods for the Balance Sheet report.
    type: int
  - name: timeframe
    description: >-
      The period size to compare to (MONTH, QUARTER, YEAR). One of: MONTH, QUARTER, YEAR.
    type: string
  - name: trackingOptionID1
    description: >-
      The tracking option 1 for the Balance Sheet report.
    type: string
  - name: trackingOptionID2
    description: >-
      The tracking option 2 for the Balance Sheet report.
    type: string
  - name: standardLayout
    description: >-
      The standard layout boolean for the Balance Sheet report. Use true or false.
    type: string
  - name: paymentsOnly
    description: >-
      return a cash basis for the Balance Sheet report. Use true or false.
    type: string
