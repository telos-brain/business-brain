name: ask_question
version: 4
description: >-
  Asks one question against the Business blueprint and returns only what
  answers it. Use for a focused factual lookup (a person, a customer, an
  area, a past decision). Do not use this for how to do something — use
  ask_sol.
workflow:
  code: WF-ASK-QUESTION
parameters:
  - name: query
    description: >-
      The question to answer. State it as a single, self-contained question.
    type: string
    required: true
