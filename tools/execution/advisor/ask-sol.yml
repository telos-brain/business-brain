name: ask_sol
version: 4
description: >-
  Ask Sol a question about this business. For how to do something, Sol
  loads the skill that holds the procedure and follows it, including any
  tool that skill names. Sol then uses Business blueprint entries where
  they change the answer, and returns the answer. Use for a procedural
  question or a question that needs both the practice and what this
  business already knows. For one stored fact, use ask_question. For
  external information, use research.
workflow:
  code: WF-ASK-FOR-ADVICE
parameters:
  - name: request
    description: >-
      The question to answer. For a how-to, say what needs doing and any
      context that would change the procedure. Include names, customers,
      and dates when they matter.
    type: string
    required: true
