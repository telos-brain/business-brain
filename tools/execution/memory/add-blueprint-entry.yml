name: add_blueprint_entry
version: 2
description: >-
  Adds a new entry under an existing category in a named blueprint. Use to
  record a distilled, reusable insight. Fails if an entry with the same title
  already exists in that blueprint. This brain has more than one blueprint, so
  pass blueprint (a code or title) on every call.
system:
  tool: add_blueprint_entry
parameters:
  - name: blueprint
    param: blueprint
    description: >-
      Code or title of the blueprint to write (company, crm, or jobs). Required
      when more than one blueprint exists. An unknown name is an error and does
      not fall back to another blueprint.
    type: string
    required: true
  - name: category
    param: category
    description: The name of an existing category to file the entry under (e.g. "Team").
    type: string
    required: true
  - name: title
    param: title
    description: A short, unique title for the entry.
    type: string
    required: true
  - name: content
    param: content
    description: The entry content as Markdown.
    type: string
    required: true
